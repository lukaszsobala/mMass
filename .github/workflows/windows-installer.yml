name: Build Windows Installer

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  wxpython-wheel:
    uses: ./.github/workflows/windows-macos-wxpython-wheel.yml
    with:
      runner: windows-latest

  build-windows-installer:
    needs: wxpython-wheel
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.wxpython-wheel.outputs.python-version }}

      - name: Download wxPython wheel
        uses: actions/download-artifact@v8
        with:
          name: wxpython-wheel
          path: wheelhouse

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install (Get-ChildItem wheelhouse/*.whl).FullName
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build installer
        shell: pwsh
        run: python packaging/windows/build_windows_installer.py

      - name: Smoke test the bundle
        shell: pwsh
        run: python packaging/smoke_test.py build/dist/windows/mMass/mMass.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: mMass-windows-installer
          path: build/installer/windows/*.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" (Get-ChildItem build/installer/windows/*.exe).FullName --clobber
