name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      # Report every interpreter's result, rather than cancelling the rest on
      # the first failure -- a break is often version-specific.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        # Mirrors the [project.optional-dependencies] test extra in
        # pyproject.toml. The project itself is deliberately NOT installed:
        # pytest's pythonpath = ["src"] already puts mspy on the path, and
        # installing would drag in wxPython and pyopenms, which the suite
        # imports without. pytest-cov is skipped -- it is unusable on 3.14
        # (see the note in pyproject.toml) and coverage is not gated here.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "numpy>=2.0" scipy numba

      - name: Run tests
        # The spectra/ sample data is gitignored, so the mzML and Bruker
        # integration tests skip here; everything else runs.
        run: python -m pytest -q
