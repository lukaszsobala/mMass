name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      # Report every interpreter's result, rather than cancelling the rest on
      # the first failure -- a break is often version-specific.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        # Mirrors the [project.optional-dependencies] test extra in
        # pyproject.toml. The project itself is deliberately NOT installed:
        # pytest's pythonpath = ["src"] already puts mspy on the path, and
        # installing would drag in wxPython, which the suite imports without.
        # pytest-cov is skipped: coverage is not gated here.
        # 3.15 needs newer NumPy/Numba (the first releases with cp315 wheels);
        # wxPython has no 3.15 wheel yet, so the GUI is not exercised there.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "numpy>=2.0" "numba>=0.60" \
            "numpy>=2.5.2; python_version >= '3.15'" \
            "numba>=0.68; python_version >= '3.15'"

      - name: Run tests
        # Every test builds the data it reads, so the whole suite runs here.
        run: python -m pytest -q
