[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mMass"
version = "7.0.0-beta21"
description = "mMass - Open Source Mass Spectrometry Tool"
readme = "README.md"
authors = [
    { name = "Łukasz Sobala" },
    { name = "Edd Salkield", email = "edd@salkield.uk" },
    { name = "Martin Strohalm" }
]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy",
    "numba",
    "wxPython>=4.1.0",
    "xdgenvpy>=3.0.0,<4.0.0",
    "requests>=2.25.1"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "numpy>=2.0",
    "scipy",
    "numba",
]

[project.urls]
Homepage = "https://github.com/lukaszsobala/mMass"
Repository = "https://github.com/lukaszsobala/mMass"

[project.scripts]
mmass = "mmass_app.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gui", "gui.*", "mspy", "mspy.*", "mmass_app", "mmass_app.*"]

[tool.setuptools.package-data]
gui = ["configs/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# wxPython is intentionally NOT a test dependency: every target tested here
# imports without wx. The Numba @njit kernels in mspy/calculations.py compile
# lazily on first call (~5-10s once per session); this is expected.
# NOTE: pytest-cov currently crashes under Python 3.14 + NumPy 2.4 (coverage's
# tracer trips numpy's "cannot load module more than once" guard). Plain
# `pytest` is unaffected; run coverage on Python <=3.13 if needed.

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]  # line-too-long — not enforced

[tool.ruff.lint.per-file-ignores]
"src/gui/*.py" = ["F403", "F405"]  # ids.py star-import is intentional
"src/mspy/__init__.py" = ["F403", "F401"]  # public API re-export via star imports
"src/mmass_app/app.py" = ["E402"]  # HiDPI awareness must run before `import wx`
